name: Publish image

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version stamped into the binary (defaults to the commit sha)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required to attach a signed provenance attestation to the image.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          # The version stamp uses `git describe`, which needs the full history.
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${GITHUB_SHA}"
          fi
          echo "version=${version}" >>"$GITHUB_OUTPUT"
          echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >>"$GITHUB_OUTPUT"

      # The image is always ghcr.io/<org>/<repo>, tagged with the commit sha.
      # Tag pushes additionally get their semver tags, and the default branch
      # moves the `latest` tag.
      - name: Collect image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=sha,format=short,prefix=
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No QEMU: the Dockerfile cross-compiles from the native builder, so all
      # three platforms build at native speed.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=publish
          cache-to: type=gha,mode=max,scope=publish
          provenance: mode=max
          sbom: true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            IMAGE_TITLE=${{ github.event.repository.name }}
            IMAGE_DESCRIPTION=${{ github.event.repository.description }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
            IMAGE_URL=${{ github.server_url }}/${{ github.repository }}
            IMAGE_LICENSES=${{ github.event.repository.license.spdx_id }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summarise
        run: |
          {
            echo "### Published \`ghcr.io/${{ github.repository }}\`"
            echo
            echo "**Digest:** \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "**Tags:**"
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/; s/$/`/'
            echo
            echo "**Platforms:** linux/amd64, linux/arm64, linux/arm/v7"
          } >>"$GITHUB_STEP_SUMMARY"

  release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            --notes "Container image: \`${IMAGE}:${GITHUB_REF_NAME}\` (linux/amd64, linux/arm64, linux/arm/v7)"
