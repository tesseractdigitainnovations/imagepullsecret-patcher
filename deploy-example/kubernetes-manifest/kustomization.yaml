apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 0_namespace.yaml
  - 1_rbac.yaml
  - 2_deployment.yaml

# Point the deployment at your own build without editing the manifests:
#   kustomize edit set image imagepullsecret-patcher=ghcr.io/<owner>/imagepullsecret-patcher:<commit-sha>
images:
  - name: ghcr.io/tesseractdigitainnovations/imagepullsecret-patcher
    newTag: latest

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: imagepullsecret-patcher
      app.kubernetes.io/part-of: imagepullsecret-patcher
