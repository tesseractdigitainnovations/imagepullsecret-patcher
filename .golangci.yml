version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - goprintffuncname
    - misspell
    - noctx
    - revive
    - unconvert
    - usestdlibvars
    - wastedassign
    - whitespace
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # Table-driven tests keep their fixtures next to the cases.
      - path: _test\.go
        linters:
          - gocritic

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/titansoft-pte-ltd/imagepullsecret-patcher
